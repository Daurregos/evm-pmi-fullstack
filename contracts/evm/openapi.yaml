openapi: 3.1.0
info:
  title: Seguimiento de Valor Ganado
  version: 1.0.0
  description: >-
    Contrato del API EVM transcrito de las fuentes canónicas. info.version
    sigue SemVer para el contrato; no versiona las rutas.
paths:
  /projects:
    get:
      operationId: listProjects
      summary: Listar proyectos para el selector
      description: >-
        Devuelve un arreglo JSON desnudo con id y name por proyecto. Si no hay
        proyectos, devuelve el arreglo vacío.
      responses:
        "200":
          description: Proyectos disponibles para el selector.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectListItem"
              examples:
                projectCollection:
                  $ref: "#/components/examples/ProjectCollection"
                emptyProjectCollection:
                  $ref: "#/components/examples/EmptyProjectCollection"
    post:
      operationId: createProject
      summary: Crear un proyecto
      description: >-
        Crea un proyecto con su nombre y fecha de corte. La respuesta contiene
        la representación de lectura del proyecto creado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "201":
          description: Proyecto creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
              examples:
                referenceProject:
                  $ref: "#/components/examples/ReferenceProject"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "422":
          $ref: "#/components/responses/ProjectValidationFailed"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: replaceProject
      summary: Reemplazar un proyecto
      description: >-
        Reemplaza todos los campos editables del proyecto. Un proyecto
        inexistente responde 404 y no crea un recurso en esa URI, porque el
        servidor asigna el identificador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWrite"
      responses:
        "200":
          description: Proyecto reemplazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRead"
              examples:
                referenceProject:
                  $ref: "#/components/examples/ReferenceProject"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ProjectValidationFailed"
    get:
      operationId: getProject
      summary: Consultar la foto analítica de un proyecto
      description: >-
        Devuelve el proyecto, todas sus actividades y el consolidado calculado
        sincrónicamente desde los datos capturados.
      responses:
        "200":
          description: Foto analítica del proyecto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAnalysis"
              examples:
                referenceProjectAnalysis:
                  $ref: "#/components/examples/ReferenceProjectAnalysis"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      summary: Eliminar un proyecto
      description: >-
        Elimina el proyecto y sus actividades. Un borrado repetido se trata
        como recurso inexistente.
      responses:
        "204":
          description: Proyecto eliminado; la respuesta no contiene cuerpo.
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/activities:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createActivity
      summary: Crear una actividad
      description: >-
        Crea una actividad dentro del proyecto. La respuesta contiene los
        cinco datos capturados y los ocho indicadores calculados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityWrite"
      responses:
        "201":
          description: Actividad creada con sus indicadores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityRead"
              examples:
                referenceActivity:
                  $ref: "#/components/examples/ReferenceActivity"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ActivityValidationFailed"
  /projects/{projectId}/activities/{activityId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ActivityId"
    put:
      operationId: replaceActivity
      summary: Reemplazar una actividad
      description: >-
        Reemplaza los cinco datos capturados de la actividad. Una actividad o
        su proyecto inexistentes responden 404 y no crean un recurso en esa
        URI, porque el servidor asigna el identificador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityWrite"
      responses:
        "200":
          description: Actividad reemplazada con sus indicadores recalculados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityRead"
              examples:
                referenceActivity:
                  $ref: "#/components/examples/ReferenceActivity"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ActivityValidationFailed"
    delete:
      operationId: deleteActivity
      summary: Eliminar una actividad
      description: >-
        Elimina la actividad del proyecto. Un borrado repetido se trata como
        recurso inexistente.
      responses:
        "204":
          description: Actividad eliminada; la respuesta no contiene cuerpo.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identificador entero del proyecto.
      schema:
        type: integer
    ActivityId:
      name: activityId
      in: path
      required: true
      description: Identificador entero de la actividad.
      schema:
        type: integer
  schemas:
    ProjectListItem:
      type: object
      additionalProperties: false
      description: Proyecto mínimo disponible para el selector.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: Identificador del proyecto.
        name:
          type: string
          minLength: 1
          description: Nombre normalizado del proyecto.
    ProjectWrite:
      type: object
      description: >-
        Datos admitidos al crear o reemplazar un proyecto. Por la consecuencia
        declarada en ADR-009, el esquema publicado es menos restrictivo que las
        reglas reales: admite null y propiedades adicionales para que negocio
        distinga required, read_only y unknown. Un cliente generado no debe
        equiparar nulabilidad ni propiedades adicionales con validez de
        negocio.
      required:
        - name
        - cutoffDate
      properties:
        name:
          type:
            - string
            - "null"
          minLength: 1
          description: >-
            Nombre obligatorio del proyecto. Se recortan los espacios laterales
            antes de validar y persistir; un null o un resultado vacío produce
            una infracción required.
        cutoffDate:
          type:
            - string
            - "null"
          format: date
          description: >-
            Fecha de corte obligatoria como full-date de RFC 3339 con forma
            YYYY-MM-DD. Un null explícito produce una infracción required.
    ProjectRead:
      type: object
      additionalProperties: false
      description: Representación de lectura de un proyecto.
      required:
        - id
        - name
        - cutoffDate
      properties:
        id:
          type: integer
          description: Identificador del proyecto.
        name:
          type: string
          minLength: 1
          description: Nombre normalizado del proyecto.
        cutoffDate:
          type: string
          format: date
          description: Fecha de corte del proyecto como full-date de RFC 3339.
    ActivityWrite:
      type: object
      description: >-
        Los cinco únicos datos capturados de una actividad. Por la consecuencia
        declarada en ADR-009, el esquema publicado es menos restrictivo que las
        reglas reales: admite null y propiedades adicionales para que negocio
        distinga required, read_only y unknown. Un cliente generado no debe
        equiparar nulabilidad ni propiedades adicionales con validez de
        negocio.
      required:
        - name
        - bac
        - plannedProgress
        - actualProgress
        - ac
      properties:
        name:
          type:
            - string
            - "null"
          minLength: 1
          description: >-
            Nombre obligatorio de la actividad. Se recortan los espacios
            laterales antes de validar y persistir; un null o un resultado vacío
            produce una infracción required.
        bac:
          type:
            - number
            - "null"
          exclusiveMinimum: 0
          description: Presupuesto total planificado; debe ser positivo.
        plannedProgress:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Avance planificado entre 0 y 100, inclusive.
        actualProgress:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Avance real entre 0 y 100, inclusive.
        ac:
          type:
            - number
            - "null"
          minimum: 0
          description: Costo real incurrido; no puede ser negativo.
    ActivityRead:
      type: object
      additionalProperties: false
      description: >-
        Representación de lectura de una actividad con datos capturados e
        indicadores derivados.
      required:
        - id
        - name
        - bac
        - plannedProgress
        - actualProgress
        - ac
        - pv
        - ev
        - cv
        - sv
        - cpi
        - spi
        - eac
        - vac
      properties:
        id:
          type: integer
          description: Identificador de la actividad.
        name:
          type: string
          minLength: 1
          description: Nombre de la actividad.
        bac:
          type: number
          exclusiveMinimum: 0
          description: Presupuesto total planificado.
        plannedProgress:
          type: number
          minimum: 0
          maximum: 100
          description: Avance planificado expresado entre 0 y 100.
        actualProgress:
          type: number
          minimum: 0
          maximum: 100
          description: Avance real expresado entre 0 y 100.
        ac:
          type: number
          minimum: 0
          description: Costo real incurrido.
        pv:
          type: number
          description: Valor planificado sin redondear.
        ev:
          type: number
          description: Valor ganado sin redondear.
        cv:
          type: number
          description: Variación de costo sin redondear.
        sv:
          type: number
          description: Variación de cronograma sin redondear.
        cpi:
          $ref: "#/components/schemas/IndexResult"
        spi:
          $ref: "#/components/schemas/IndexResult"
        eac:
          type:
            - number
            - "null"
          description: Estimación al completar, o null si no es evaluable.
        vac:
          type:
            - number
            - "null"
          description: Variación al completar, o null si no es evaluable.
    ProjectSummary:
      type: object
      additionalProperties: false
      description: >-
        Consolidado calculado después de sumar BAC, PV, EV y AC de todas las
        actividades.
      required:
        - bac
        - pv
        - ev
        - ac
        - cv
        - sv
        - cpi
        - spi
        - eac
        - vac
        - progress
        - activitiesWithEvAndZeroAc
      properties:
        bac:
          type: number
          description: Suma de BAC de las actividades.
        pv:
          type: number
          description: Suma de PV de las actividades.
        ev:
          type: number
          description: Suma de EV de las actividades.
        ac:
          type: number
          description: Suma de AC de las actividades.
        cv:
          type: number
          description: Variación consolidada de costo.
        sv:
          type: number
          description: Variación consolidada de cronograma.
        cpi:
          $ref: "#/components/schemas/IndexResult"
        spi:
          $ref: "#/components/schemas/IndexResult"
        eac:
          type:
            - number
            - "null"
          description: Estimación consolidada, o null si no es evaluable.
        vac:
          type:
            - number
            - "null"
          description: Variación consolidada, o null si no es evaluable.
        progress:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: Avance del proyecto, o null si no es evaluable.
        activitiesWithEvAndZeroAc:
          type: integer
          minimum: 0
          description: Cantidad de actividades con EV mayor que cero y AC cero.
    ProjectAnalysis:
      type: object
      additionalProperties: false
      description: Foto analítica completa del proyecto.
      required:
        - project
        - activities
        - summary
      properties:
        project:
          $ref: "#/components/schemas/ProjectRead"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ActivityRead"
        summary:
          $ref: "#/components/schemas/ProjectSummary"
    IndexResult:
      type: object
      additionalProperties: false
      description: >-
        Resultado de CPI o SPI. El objeto y sus cuatro miembros siempre están
        presentes; solo value y display son nulables cuando el índice no es
        evaluable.
      required:
        - value
        - display
        - status
        - label
      properties:
        value:
          type:
            - number
            - "null"
          description: Valor completo sin redondear, o null si no es evaluable.
        display:
          type:
            - string
            - "null"
          description: >-
            Representación resuelta por el backend, incluido el marcador de
            cruce de banda cuando corresponde, o null si no es evaluable.
        status:
          type: string
          enum:
            - unfavorable
            - neutral
            - favorable
            - not_evaluable
          description: Estado estable legible por máquina.
        label:
          type: string
          description: Interpretación en español legible por personas.
    Violation:
      type: object
      additionalProperties: false
      description: Infracción de validación asociada con un campo.
      required:
        - field
        - rule
        - message
      properties:
        field:
          type: string
          description: >-
            Los campos conocidos usan el nombre lowerCamelCase canónico; una
            propiedad desconocida conserva el nombre recibido.
        rule:
          type: string
          enum:
            - required
            - positive
            - non_negative
            - range_0_100
            - read_only
            - unknown
          description: Regla estable y cerrada legible por máquina.
        message:
          type: string
          description: Texto en español que explica cómo corregir la infracción.
    Error:
      type: object
      additionalProperties: false
      description: Envolvente única para los errores 400, 404 y 422.
      required:
        - code
        - message
        - violations
      properties:
        code:
          type: string
          enum:
            - malformed_request
            - not_found
            - validation_failed
          description: Código estable legible por máquina.
        message:
          type: string
          description: Mensaje de error en español para personas.
        violations:
          type: array
          description: >-
            Infracciones acumuladas; permanece vacío para malformed_request y
            not_found.
          items:
            $ref: "#/components/schemas/Violation"
  responses:
    MalformedRequest:
      description: La petición JSON no pudo interpretarse.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            malformedRequest:
              $ref: "#/components/examples/MalformedRequest"
    NotFound:
      description: El proyecto o la actividad no existe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notFound:
              $ref: "#/components/examples/NotFound"
    ProjectValidationFailed:
      description: La escritura del proyecto incumple reglas de validación.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validationV1:
              $ref: "#/components/examples/ValidationV1"
            validationV2:
              $ref: "#/components/examples/ValidationV2"
            validationV10:
              $ref: "#/components/examples/ValidationV10"
    ActivityValidationFailed:
