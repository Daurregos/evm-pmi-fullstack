x-decisions-missing:
  title: Decisiones faltantes
  items:
    - question: ¿Qué forma exacta devuelve GET /projects?
      blockingReason: >-
        ADR-006a decide que la operación abastece el selector, pero sin saber
        si devuelve un arreglo desnudo o una envolvente no puede escribirse su
        respuesta 200; por eso la operación queda fuera.
      responsibleAdr: ADR-006b
      fixtureHint: >-
        Insinuación, no decisión: readResponse.project muestra la forma de un
        proyecto individual, pero no la forma de la colección.
    - question: >-
        ¿Las ediciones de proyecto y actividad usan PUT o PATCH, y reemplazan
        el recurso completo o aplican cambios parciales?
      blockingReason: >-
        Sin verbo ni semántica de actualización no pueden declararse las
        operaciones, sus cuerpos obligatorios ni el significado de un campo
        ausente; por eso las ediciones quedan fuera.
      responsibleAdr: ADR-006a
      fixtureHint: >-
        Insinuación, no decisión: las peticiones de validationChecks contienen
        formas completas, pero son casos de error y no ejemplos de edición.
    - question: >-
        ¿Son obligatorios bac, plannedProgress, actualProgress y ac en toda
        escritura de actividad?
      blockingReason: >-
        PRD §7.5 fija sus rangos, pero solo declara expresamente obligatorios el
        nombre y la fecha de corte; el required del esquema no puede incluir
        los cuatro números sin esta decisión.
      responsibleAdr: ADR-006b
      fixtureHint: >-
        Insinuación, no decisión: todas las peticiones de actividad del fixture
        incluyen los cuatro campos numéricos.
    - question: ¿Qué tipo y formato de cable tiene cutoffDate?
      blockingReason: >-
        ADR-006b enumera el campo, pero no decide si el contrato debe declararlo
        como string con format date u otra representación; el esquema deja el
        tipo y el formato sin restringir.
      responsibleAdr: ADR-006b
      fixtureHint: >-
        Insinuación, no decisión: readResponse y V1/V2 usan cadenas con forma
        YYYY-MM-DD.
    - question: ¿Qué versión identifica este documento OpenAPI?
      blockingReason: >-
        info.version es obligatorio en OpenAPI 3.1, pero ninguna fuente decide
        una versión del documento o del API. Se usa decision-pending solo para
        mantener el YAML validable y no como versionado de rutas.
      responsibleAdr: ADR-006a
      fixtureHint: >-
        Insinuación descartada como decisión: 4.0.0 identifica la versión del
        fixture, no la del documento OpenAPI ni la del API.
    - question: >-
        ¿Cómo se tratan las propiedades de escritura desconocidas que no son
        campos de solo lectura?
      blockingReason: >-
        ADR-009 obliga a rechazar campos de solo lectura con 422, pero no decide
        si una propiedad arbitraria se ignora, se rechaza ni con qué código; el
        esquema no fija additionalProperties.
      responsibleAdr: ADR-009
      fixtureHint: >-
        Insinuación limitada, no decisión: V8 cubre cpi porque es de solo
        lectura, pero no incluye una propiedad desconocida arbitraria.
    - question: ¿Un nombre compuesto solo por espacios incumple required?
      blockingReason: >-
        El PRD y el fixture rechazan la cadena vacía, pero no deciden recorte ni
        normalización de espacios; minLength 1 no puede resolver ese caso.
      responsibleAdr: ADR-009
      fixtureHint: >-
        Sin insinuación: V1, V3 y V9 usan una cadena vacía y no cubren espacios.
